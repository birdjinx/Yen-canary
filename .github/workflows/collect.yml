name: collect

on:
  schedule:
    # 평일 매일 2회 (UTC). 도쿄 장 마감 후 + 뉴욕 장 마감 후 근처.
    # UTC 07:00 ≈ KST 16:00 (도쿄 마감 뒤), UTC 21:00 ≈ KST 06:00 (NY 마감 뒤)
    - cron: "0 7 * * 1-5"
    - cron: "0 21 * * 1-5"
  push:
    paths:
      - "docs/manual.json"   # 수동값 커밋 시 즉시 재수집·분석
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Collect data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect_data.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
